            transform: scale(0.9);
            line-height: 1.4;
            margin: 0;
        }
        #frase-texto.active {
            opacity: 1;
            transform: scale(1);
        }
        #contador-frase {
            color: #58a6ff;
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: bold;
            opacity: 0.7;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #030712 0%, #020208 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #start-overlay h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 35px;
            max-width: 280px;
            line-height: 1.5;
        }
        .btn-play {
            padding: 16px 40px;
            background: linear-gradient(135deg, #1e40af, #3b82f6, #60a5fa);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }
        .btn-play:active {
            transform: scale(0.95);
        }
        #timer-box {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            letter-spacing: 3px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 15px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
        }
    </style>

</head>
